# Keep the three dependency ecosystems patched. Grouped weekly PRs keep the
# noise low; the CI workflow (type-check, tests, prod audit, clippy) gates
# every update before it can merge. Patch updates (and GitHub Actions minor
# updates) are approved — and auto-merged where master requires status
# checks — see .github/workflows/dependabot-auto-merge.yml (audit F-21).
#
# cooldown: version updates are proposed only once a release is a week old,
# so a hijacked or broken publish is usually caught and yanked before it
# reaches a pull request (7 days is also zizmor's dependabot-cooldown
# minimum). Security updates are never delayed.
#
# Not covered by Dependabot: the Rust toolchain (rust-toolchain.toml) and
# Node (.nvmrc) — bump those by hand (DEPLOYMENT.md, "Toolchains").
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Pinned deliberately: newer monaco-editor bundles a dompurify with open
      # advisories (see src/lib/components/json-studio/monaco-setup.ts).
      - dependency-name: monaco-editor
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Paired with tauri (src-tauri/Cargo.toml): webview2-com must be the
      # version tauri uses, and windows-core the one webview2-com is built
      # on. Either one bumped alone breaks the Windows build (windows-core
      # 0.100 did: two copies of its COM types). Move them by hand, together,
      # when tauri moves; patch releases stay compatible and still come.
      - dependency-name: webview2-com
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: windows-core
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
