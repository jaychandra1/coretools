name: Generate Cargo.lock

# One-off / on demand (audit F-05 / S-3): resolves the Rust dependency graph
# and pushes src-tauri/Cargo.lock to the `chore/cargo-lock` branch for
# review. Merge it through a pull request; from then on CI and releases
# verify the lockfile (`cargo metadata --locked`) and Dependabot proposes
# updates to it. The Release workflow refuses to run until it is merged.
#
# Run: Actions → "Generate Cargo.lock" → Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lock:
    name: Generate src-tauri/Cargo.lock
    runs-on: ubuntu-22.04
    permissions:
      contents: write # pushes the chore/cargo-lock review branch only
    steps:
      # Credentials stay in the checkout: the last step pushes with them.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The toolchain pinned in rust-toolchain.toml resolves the lockfile.
      - name: Set up Rust
        run: bash scripts/setup-rust.sh

      # Resolution only — nothing is compiled, so no system libraries needed.
      # The lockfile covers every target (Windows, macOS, Linux).
      - name: Resolve dependencies
        working-directory: src-tauri
        run: cargo generate-lockfile

      - name: Push to the review branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/cargo-lock
          git add src-tauri/Cargo.lock
          git commit -m "chore: commit src-tauri/Cargo.lock for reproducible builds (audit F-05)"
          git push --force origin chore/cargo-lock
          {
            echo "### Cargo.lock generated"
            echo ""
            echo "Open a pull request: https://github.com/${GITHUB_REPOSITORY}/compare/master...chore/cargo-lock?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
