name: Build & Publish Installers

# Builds the CoreTools desktop installers for Windows, macOS and Linux on real
# machines (GitHub-hosted runners), then commits the finished files into
# `website/downloads/`. Vercel redeploys automatically and serves them at
#   https://<your-site>/downloads/CoreTools-Windows-Setup.exe   (etc.)
# so visitors download straight from your marketing site — no GitHub Releases.
#
# Triggers on every push to master (skipping doc-only and the downloads folder
# itself, so the auto-commit can't trigger an endless loop). You can also run it
# by hand from the Actions tab.

on:
  push:
    branches: [master]
    paths-ignore:
      - "website/downloads/**"
      - "**/*.md"
  workflow_dispatch:

# Never run two installer builds at once; newer pushes supersede older runs.
concurrency:
  group: build-installers
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            glob: "src-tauri/target/release/bundle/nsis/*-setup.exe"
            out: CoreTools-Windows-Setup.exe
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            glob: "src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg"
            out: CoreTools-macOS.dmg
          - platform: ubuntu-22.04
            args: ""
            glob: "src-tauri/target/release/bundle/appimage/*.AppImage"
            out: CoreTools-Linux.AppImage

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate app icons
        run: npm run icon

      - name: Build the desktop app
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Collect the installer under a stable name
        shell: bash
        run: |
          set -e
          mkdir -p staging
          src=$(ls ${{ matrix.glob }} | head -n1)
          echo "Found installer: $src"
          cp "$src" "staging/${{ matrix.out }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: staging/${{ matrix.out }}
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    # Publish whatever built successfully, even if one platform's build failed.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to commit the installers back to the repo
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Download all built installers
        uses: actions/download-artifact@v4
        with:
          path: incoming
        continue-on-error: true

      - name: Move installers into website/downloads
        run: |
          mkdir -p website/downloads
          find incoming -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -exec mv {} website/downloads/ \;
          ls -lh website/downloads

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/downloads
          if git diff --staged --quiet; then
            echo "No installer changes to publish."
          else
            # "[skip actions]" stops GitHub Actions from re-triggering (loop
            # safety, together with paths-ignore) but — unlike "[skip ci]" —
            # does NOT stop Vercel from deploying the new installers.
            git commit -m "chore: publish desktop installers [skip actions]"
            git push
          fi
