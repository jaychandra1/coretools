name: Release

# Builds the desktop installers and publishes them to the PUBLIC
# jaychandra1/artifacts repository (this source repo stays private).
#
# Trigger: pushing a version tag (v0.3.0, v1.0.0, …). Tag-only releases mean:
#   - binaries never enter git history (the old flow grew .git by ~90 MB per
#     release and taught SmartScreen a fresh unknown hash on every push);
#   - each installer hash lives long enough to accumulate reputation;
#   - every release is versioned, listed, and permanently downloadable.
#
# In jaychandra1/artifacts (shared by several apps) each version becomes:
#   - release `coretools-v<version>` — kept forever;
#   - release `coretools-latest` — same files, replaced on every newer
#     release, so the website's links never change:
#       https://github.com/jaychandra1/artifacts/releases/download/coretools-latest/CoreTools-Windows-Setup.exe
#   - a regenerated index in coretools/releases/ (README, latest.json).
# Publishing needs the ARTIFACTS_REPO_TOKEN secret — see DEPLOYMENT.md §2.
#
# GitHub runs the workflow as it exists IN THE TAGGED COMMIT. Commit every
# change first, then `npm version`: a tag on an older commit runs that
# commit's (possibly outdated) release steps. To (re)publish the version in
# package.json from master without a new tag: Actions → Release → Run
# workflow (same gates; the tag-match check is skipped).
#
# Release flow:  npm version 0.3.0 -m "release: v%s"
#                git push origin HEAD --follow-tags
#
# Code signing (when certificates are available): add the secrets and wire
# `bundle.windows.signCommand` (Azure Trusted Signing) or
# `certificateThumbprint`, plus macOS `signingIdentity` + notarization —
# see DEPLOYMENT.md §3. Tauri signs during `tauri build`; no structural
# workflow change is needed.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release mid-publish.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Gate — tests, types, audit, version match
    runs-on: ubuntu-latest
    steps:
      # Fail in seconds, not after the ~20-minute platform builds: the
      # publish job needs a working token for the public artifacts repo.
      - name: Publishing token is set and valid
        env:
          GH_TOKEN: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The ARTIFACTS_REPO_TOKEN secret is missing — add it before releasing (DEPLOYMENT.md §2)."
            exit 1
          fi
          if ! gh api repos/jaychandra1/artifacts --jq .full_name >/dev/null; then
            echo "::error::ARTIFACTS_REPO_TOKEN was rejected by GitHub (expired or revoked?) — regenerate it (DEPLOYMENT.md §2)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (lockfile-exact)
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=low

      - name: Version strings in sync
        run: node scripts/sync-version.mjs --check

      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      # Only reviewed code may ship (audit F-03/F-04): the commit being
      # released must already be part of master's history. A tag on a side
      # commit — or on anything pushed around branch protection — is refused.
      - name: Released commit is on master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/master...${GITHUB_SHA}" --jq .status)
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "::error::${GITHUB_SHA} is not on master (compare status: ${status}) — release only merged commits."
            exit 1
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            glob: "src-tauri/target/release/bundle/nsis/*-setup.exe"
            out: CoreTools-Windows-Setup.exe
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            glob: "src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg"
            out: CoreTools-macOS.dmg
          - platform: ubuntu-22.04
            args: ""
            glob: "src-tauri/target/release/bundle/appimage/*.AppImage"
            out: CoreTools-Linux.AppImage

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned master
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libdbus-1-dev \
            pkg-config

      - name: Install frontend dependencies
        run: npm ci

      # Reproducible builds (audit F-05): with Cargo.lock committed, the
      # release builds exactly the reviewed dependency set or fails.
      - name: Cargo.lock is committed and current
        working-directory: src-tauri
        shell: bash
        run: |
          if [ -f Cargo.lock ]; then
            cargo metadata --locked --format-version 1 > /dev/null
          else
            echo "::warning::src-tauri/Cargo.lock is not committed — this build resolved dependencies freshly (audit F-05)."
          fi

      - name: Generate app icons
        run: npm run icon

      # The Google OAuth "Desktop app" client for Authenticator cloud backup
      # is compiled in (see DEPLOYMENT.md §Cloud backup). When these secrets
      # are absent the build still succeeds and the feature reports itself
      # as not configured.
      - name: Build the desktop app
        env:
          CORETOOLS_GOOGLE_CLIENT_ID: ${{ secrets.CORETOOLS_GOOGLE_CLIENT_ID }}
          CORETOOLS_GOOGLE_CLIENT_SECRET: ${{ secrets.CORETOOLS_GOOGLE_CLIENT_SECRET }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Collect the installer under its stable asset name
        shell: bash
        run: |
          set -e
          mkdir -p staging
          src=$(ls ${{ matrix.glob }} | head -n1)
          echo "Found installer: $src"
          cp "$src" "staging/${{ matrix.out }}"

      - name: Upload installer artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.out }}
          path: staging/${{ matrix.out }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to jaychandra1/artifacts
    # A release is all-or-nothing: if any platform failed, nothing ships and
    # nothing is overwritten. No mixed-version download sets, ever.
    needs: build
    runs-on: ubuntu-latest
    # Publishing pauses here for a required reviewer once the `release`
    # environment has protection rules (DEPLOYMENT.md §2 · audit F-03): no
    # one — not a stolen session, not a bad merge — publishes installers
    # without an explicit approval. (ARTIFACTS_REPO_TOKEN stays a repository
    # secret so the quality job can fail fast on an expired token.)
    environment:
      name: release
      url: https://github.com/jaychandra1/artifacts/tree/main/coretools/releases
    # Publishing goes to ANOTHER (public) repository with its own token, so
    # this repo's GITHUB_TOKEN stays read-only. id-token lets Sigstore issue
    # a short-lived signing certificate bound to this workflow run.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout (publish script + changelog)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Download all built installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: incoming
          merge-multiple: true

      - name: Require all three installers
        run: |
          set -e
          ls -lh incoming
          for f in CoreTools-Windows-Setup.exe CoreTools-macOS.dmg CoreTools-Linux.AppImage; do
            test -f "incoming/$f" || { echo "::error::Missing $f — refusing to publish a partial release"; exit 1; }
          done

      - name: Generate SHA-256 checksums
        run: |
          cd incoming
          sha256sum CoreTools-Windows-Setup.exe CoreTools-macOS.dmg CoreTools-Linux.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Keyless Sigstore signature over the checksum file (which pins every
      # installer). The certificate names this repository + workflow + tag,
      # so someone holding only ARTIFACTS_REPO_TOKEN can replace the files
      # but cannot produce a signature that verifies (audit F-03). The
      # signature is recorded in Sigstore's public transparency log.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the checksums
        working-directory: incoming
        run: cosign sign-blob --yes --bundle SHA256SUMS.txt.sigstore.json SHA256SUMS.txt

      # package.json is the version source; the quality job already refused
      # any tag that doesn't match it.
      - name: Resolve version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish installers + update coretools/releases
        uses: ./.github/actions/publish-artifacts
        with:
          app: coretools
          app-name: CoreTools
          version: ${{ steps.version.outputs.value }}
          artifacts-repo: jaychandra1/artifacts
          token: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
          assets-dir: incoming
          # Lets the notes print the exact `cosign verify-blob` command.
          signer: https://github.com/${{ github.repository }}/.github/workflows/release.yml
