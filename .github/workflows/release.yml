name: Release

# Builds the desktop installers and publishes them to the PUBLIC
# jaychandra1/artifacts repository (this source repo stays private).
#
# Tag-only releases mean:
#   - binaries never enter git history (the old flow grew .git by ~90 MB per
#     release and taught SmartScreen a fresh unknown hash on every push);
#   - each installer hash lives long enough to accumulate reputation;
#   - every release is versioned, listed, and permanently downloadable.
#
# In jaychandra1/artifacts (shared by several apps) each version becomes:
#   - release `coretools-v<version>` — published once, never overwritten
#     (a re-run with the same files leaves it alone; different files fail
#     unless the overwrite-versioned-release input says otherwise);
#   - release `coretools-latest` — the same files, replaced on every newer
#     release, so the website's links never change:
#       https://github.com/jaychandra1/artifacts/releases/download/coretools-latest/CoreTools-Windows-Setup.exe
#   - a regenerated index in coretools/releases/ (README, latest.json, and
#     the in-app update manifest updater.json).
# Publishing needs the ARTIFACTS_REPO_TOKEN secret — see DEPLOYMENT.md §2.
# Rolling coretools-latest back, or widening a staged rollout, never rebuilds:
# Actions → "Promote or roll back latest" (promote-latest.yml).
#
# How a run starts — every mode runs on a v* tag ref or on master, so
# github.ref / github.sha, the checkout, the tag check, the "on master"
# check and the Sigstore identity (release.yml@refs/tags/v… or @…/master)
# always describe the commit being released:
#   1. Release pull request (audit F-26, the preferred way): Actions →
#      "Prepare release" opens a PR that bumps the version and dates
#      CHANGELOG.md. Merging it makes CI (ci.yml → tag-release) tag the merge
#      commit and start THIS workflow with workflow_dispatch on that tag. (A
#      tag pushed with GITHUB_TOKEN triggers no `push` workflows;
#      workflow_dispatch is GitHub's documented exception, and dispatching on
#      the tag ref keeps every check below identical to a pushed tag.)
#   2. Manual tag push (still supported where master accepts pushes):
#        npm version 0.3.0 -m "release: v%s"
#        git push origin HEAD --follow-tags
#      (its package.json hooks also move the CHANGELOG notes into the
#      release commit, and refuse when there are none).
#   3. Re-publish package.json's version from master without a new tag:
#      Actions → Release → Run workflow on master (same gates; the
#      tag-match check is skipped). Only where the `release` environment
#      admits master — infra/terraform/github's release_branch_patterns,
#      empty by default, so its policy takes v* tags only. Otherwise the
#      quality job refuses the run in seconds instead of letting the
#      environment refuse it after every platform was built: release a new
#      version (Actions → Prepare release), or run this workflow on the
#      version's v* tag.
# A run started from Actions → Release → Run workflow can also set a staged
# rollout and an update-check back-off (inputs below; DEPLOYMENT.md
# "Rollback, staged rollout and update back-off"). Tag pushes and CI's
# tag-release take the rollout from the optional RELEASE_ROLLOUT repository
# variable (unset = everyone) and the app's own check schedule.
#
# GitHub runs the workflow as it exists IN THE TAGGED COMMIT. Commit every
# change first, then tag: a tag on an older commit runs that commit's
# (possibly outdated) release steps.
#
# Every release ships CoreTools-sbom.cdx.json (CycloneDX: npm + Rust
# dependencies, audit F-30). SHA256SUMS.txt lists every published file —
# installers, SBOM, and with in-app updates the macOS update archive, the
# *.sig files and updater.json — so the Sigstore signature covers all of
# them. src-tauri/Cargo.lock must be committed and current (audit S-3 / H2):
# without it the release refuses to run.
#
# Microsoft Store: once the MSIX_IDENTITY_NAME, MSIX_PUBLISHER and
# MSIX_PUBLISHER_DISPLAY_NAME repository variables hold Partner Center's
# identity for CoreTools, the Windows build also packs an MSIX, kept as the
# run's `microsoft-store-msix` artifact (30 days) for uploading in Partner
# Center. It is never published here (DEPLOYMENT.md, "Microsoft Store").
#
# Code signing (audit F-01) switches on per platform once all of that
# platform's credentials exist (DEPLOYMENT.md §3); without them the
# installers are built unsigned, exactly as before:
#   - Windows: Azure Artifact Signing (formerly Trusted Signing) through
#     artifact-signing-cli as Tauri's bundle.windows.signCommand, passed with
#     `--config` (src-tauri/tauri.conf.json is not edited).
#   - macOS: Developer ID + notarization from the APPLE_* variables Tauri
#     reads (it imports the certificate into a temporary keychain itself).
#   - Linux: the AppImage stays unsigned; the signed SHA256SUMS.txt covers it.
# A signed platform compiles first with no signing credentials in the
# environment (`tauri build --no-bundle`), then bundles and signs in a
# separate step (`tauri bundle`), so build scripts don't receive the signing
# secrets as environment variables. That is not a security boundary: the
# steps share one runner and user, and the bundling step itself runs
# node_modules/.bin/tauri. The OS signing services (Azure, Apple) are only
# reachable from that step's short-lived credentials, though; the updater key
# below is the one secret that signs offline, so it gets its own job.
#
# In-app updates (audit S-2 / H1) switch on with the TAURI_UPDATER_PUBKEY
# repository variable (DEPLOYMENT.md "In-app updates"): the build jobs compile
# that public key into the app and bundle WITHOUT Tauri's
# createUpdaterArtifacts (which would need the private key at bundle time),
# so no build job ever holds the updater's private key. The separate
# `sign-updates` job — ubuntu, no build, `npm ci --ignore-scripts`, in the
# `release` environment — downloads the finished update files, signs
# version-named copies (CoreTools_<version>_<target>.<ext>, the name installed
# copies require in the signature) with `tauri signer sign`, verifies them
# against the public key, and hands only the .sig files to the publish job,
# which writes updater.json — the manifest installed copies poll.
#
# No build cache is restored in this workflow: a cache written by an
# ordinary CI run (or a pull request) must never feed a release build.
# For the same reason every setup-node step sets package-manager-cache:
# false, so setup-node never restores or saves an npm cache here.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      rollout:
        description: Staged rollout — percent of installed copies offered this update (1–100). Empty = the RELEASE_ROLLOUT variable, else everyone.
        required: false
        default: ""
        type: string
      check-after-hours:
        description: Ask installed copies to check for updates at most every N hours (1–168). Empty = the app's default.
        required: false
        default: ""
        type: string
      overwrite-versioned-release:
        description: Replace the files of an already published coretools-v<version> release (a rebuild changes every checksum). Leave off.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# One release at a time, whatever the ref (tags, master, promote-latest.yml
# share the group), and never cancelled mid-publish. GitHub keeps at most one
# run waiting per group: starting a third replaces the waiting one, which is
# then cancelled — so start releases one by one. A release paused for the
# `release` environment's approval still holds the group, so a rollback
# (promote-latest.yml) queues behind it: reject or cancel that release first
# (docs/runbooks/bad-release.md). stop-updates.yml stays outside the group.
concurrency:
  group: coretools-release
  cancel-in-progress: false

jobs:
  quality:
    name: Gate — tests, types, audit, version match
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # reads the `release` environment's deployment policy (master runs)
    outputs:
      version: ${{ steps.version.outputs.value }}
      sign-windows: ${{ steps.signing.outputs.windows }}
      sign-macos: ${{ steps.signing.outputs.macos }}
      code-signed: ${{ steps.signing.outputs.platforms }}
      updater: ${{ steps.updater.outputs.enabled }}
    steps:
      - name: Release ref is a v* tag or master
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "Releasing tag ${GITHUB_REF_NAME} (${GITHUB_EVENT_NAME})." ;;
            refs/heads/master) echo "::notice::Re-publishing package.json's version from master (no tag)." ;;
            *)
              echo "::error::Run the Release workflow on a v* tag or on master, not ${GITHUB_REF}."
              exit 1
              ;;
          esac

      # Mode 3 (re-publish from master) reaches sign-updates and publish only
      # if the `release` environment admits master. Its deployment policy
      # (infra/terraform/github: v* tags, plus release_branch_patterns —
      # empty by default) would otherwise refuse the run after every
      # platform was built; refuse it here instead. Settings that can't be
      # read don't block: the environment still enforces its own policy.
      - name: The release environment admits master
        if: github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="repos/${GITHUB_REPOSITORY}/environments/release"
          if ! custom=$(gh api "$api" --jq '.deployment_branch_policy.custom_branch_policies // false' 2>"$RUNNER_TEMP/env.err"); then
            if grep -q 'HTTP 404' "$RUNNER_TEMP/env.err"; then
              echo "No \`release\` environment yet — nothing restricts a master run."
            else
              echo "::warning::Couldn't read the \`release\` environment's deployment policy ($(head -n 1 "$RUNNER_TEMP/env.err")) — continuing; the environment enforces it anyway."
            fi
            exit 0
          fi
          if [ "$custom" != "true" ]; then
            echo "The \`release\` environment has no custom branch/tag policy — not restricted to v* tags."
            exit 0
          fi
          if ! branches=$(gh api --paginate "${api}/deployment-branch-policies" \
              --jq '.branch_policies[] | select((.type // "branch") == "branch") | .name'); then
            echo "::warning::Couldn't list the \`release\` environment's deployment policies — continuing; the environment enforces them anyway."
            exit 0
          fi
          mapfile -t patterns <<< "$branches"
          for pattern in "${patterns[@]}"; do
            # shellcheck disable=SC2053 # a deployment policy name is a glob
            if [[ master == $pattern ]]; then
              echo "The \`release\` environment admits master (policy \"${pattern}\")."
              exit 0
            fi
          done
          echo "::error::The \`release\` environment's deployment policy doesn't admit master, so this run would build every platform and then be refused before signing or publishing. Release a new version (Actions → Prepare release), or run Release on the version's v* tag. To allow master runs, add \"master\" to release_branch_patterns (infra/terraform/github)."
          exit 1

      # Fail in seconds, not after the platform builds.
      - name: Rollout inputs are valid
        env:
          ROLLOUT: ${{ inputs.rollout || vars.RELEASE_ROLLOUT }}
          CHECK_AFTER_HOURS: ${{ inputs.check-after-hours }}
        run: |
          set -euo pipefail
          valid() { # <value> <max>: empty, or a whole number 1..max
            [ -z "$1" ] || { printf '%s' "$1" | grep -Eq '^[0-9]+$' && [ "$1" -ge 1 ] && [ "$1" -le "$2" ]; }
          }
          if ! valid "$ROLLOUT" 100; then
            echo "::error::rollout must be empty or a whole number from 1 to 100 (got \"${ROLLOUT}\")."
            exit 1
          fi
          if ! valid "$CHECK_AFTER_HOURS" 168; then
            echo "::error::check-after-hours must be empty or a whole number from 1 to 168 (got \"${CHECK_AFTER_HOURS}\")."
            exit 1
          fi
          checks="the app's default schedule"
          if [ -n "$CHECK_AFTER_HOURS" ]; then checks="at most every ${CHECK_AFTER_HOURS} h"; fi
          {
            echo "### Rollout"
            echo "- Offered to: ${ROLLOUT:-100}% of installed copies"
            echo "- Update checks: ${checks}"
          } >> "$GITHUB_STEP_SUMMARY"

      # Fail in seconds, not after the ~20-minute platform builds: the
      # publish job needs a working token for the public artifacts repo.
      - name: Publishing token is set and valid
        env:
          GH_TOKEN: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The ARTIFACTS_REPO_TOKEN secret is missing — add it before releasing (DEPLOYMENT.md §2)."
            exit 1
          fi
          if ! gh api repos/jaychandra1/artifacts --jq .full_name >/dev/null; then
            echo "::error::ARTIFACTS_REPO_TOKEN was rejected by GitHub (expired or revoked?) — regenerate it (DEPLOYMENT.md §2)."
            exit 1
          fi

      # Audit F-01. Each platform is signed only when ALL of its credentials
      # are configured; none = unsigned build (as today); some = error, so a
      # half-finished setup never silently ships unsigned installers. Only
      # presence flags reach the shell — never the secret values.
      - name: Code-signing configuration
        id: signing
        env:
          HAS_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID != '' }}
          HAS_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
          HAS_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID != '' }}
          HAS_AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT != '' }}
          HAS_AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT != '' }}
          HAS_AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE != '' }}
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD != '' }}
          HAS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID != '' }}
        run: |
          set -euo pipefail
          signed=()
          resolve() { # <output name> <platform> <label> <credential names...>
            local out=$1 platform=$2 label=$3 name flag
            shift 3
            local present=() missing=()
            for name in "$@"; do
              flag="HAS_${name}"
              if [ "${!flag}" = "true" ]; then present+=("$name"); else missing+=("$name"); fi
            done
            if [ ${#missing[@]} -eq 0 ]; then
              echo "${out}=true" >> "$GITHUB_OUTPUT"
              signed+=("$platform")
              echo "- ${platform}: **code-signed** (${label})" >> "$GITHUB_STEP_SUMMARY"
            elif [ ${#present[@]} -eq 0 ]; then
              echo "${out}=false" >> "$GITHUB_OUTPUT"
              echo "- ${platform}: unsigned (no ${label} credentials configured)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::${platform} code signing is half-configured — missing: ${missing[*]} (DEPLOYMENT.md §3). Add them, or remove the others to build unsigned."
              return 1
            fi
          }
          echo "### Code signing" >> "$GITHUB_STEP_SUMMARY"
          resolve windows Windows "Azure Artifact Signing" \
            AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID \
            AZURE_ARTIFACT_SIGNING_ENDPOINT AZURE_ARTIFACT_SIGNING_ACCOUNT AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE
          resolve macos macOS "Developer ID + notarization" \
            APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          echo "- Linux: AppImage unsigned (covered by the signed SHA256SUMS.txt)" >> "$GITHUB_STEP_SUMMARY"
          platforms=$(IFS=,; echo "${signed[*]:-}")
          echo "platforms=${platforms}" >> "$GITHUB_OUTPUT"

      # In-app updates: the build compiles in the updater's public key (the
      # TAURI_UPDATER_PUBKEY repository variable, which switches updates on)
      # and the sign-updates job signs with the private key. Both or neither:
      # half a setup would publish updates no installed copy can verify. This
      # job can see the private key only while it is a repository secret; once
      # it lives in the `release` environment (DEPLOYMENT.md), sign-updates
      # checks it there — and that it matches the public key — before
      # anything is published.
      - name: In-app update signing
        id: updater
        env:
          HAS_REPO_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          HAS_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY != '' }}
        run: |
          if [ "$HAS_PUBKEY" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "- In-app updates: **signed** by the sign-updates job — installed copies update themselves" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$HAS_REPO_KEY" = "false" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "- In-app updates: off (no updater key) — the app downloads installers instead (DEPLOYMENT.md, In-app updates)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::In-app update signing is half-configured: set both the TAURI_SIGNING_PRIVATE_KEY secret and the TAURI_UPDATER_PUBKEY repository variable, or neither (DEPLOYMENT.md, In-app updates)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Audit S-3 / H2: a release builds exactly the reviewed dependency set.
      # (CI on ordinary pushes only warns until the lockfile is committed.)
      - name: Cargo.lock is committed
        run: |
          if [ ! -f src-tauri/Cargo.lock ]; then
            echo "::error::src-tauri/Cargo.lock is not committed — releases need it (audit S-3). Run Actions → 'Generate Cargo.lock', merge its pull request, then release."
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Fail in seconds, not after the builds compiled a malformed key into
      # every installer (sign-updates would then refuse it). Same parser as
      # sign-updates' check; Node's crypto only, no packages needed.
      - name: Updater public key is well-formed
        if: steps.updater.outputs.enabled == 'true'
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: node scripts/verify-update-signature.mjs --pubkey "$PUBKEY" --check-key

      # The Microsoft Store package (built on Windows, see the build job) is
      # on once Partner Center's identity for CoreTools is set: all three
      # repository variables or none. A typo fails here, not after the builds.
      - name: Microsoft Store identity
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          set -euo pipefail
          result=$(node scripts/msix.mjs check)
          echo "$result"
          echo "- $result" >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies (lockfile-exact)
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Unit tests
        run: npm test

      # Shipped dependencies only: an advisory in a dev-only tool (test
      # runner, bundler) must not block a hotfix. CI reports those.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=low

      # The Rust side of the same gate: a RustSec advisory against a crate in
      # the committed lockfile stops the release (deny.toml decides what
      # counts). security.yml runs the same check on pushes and weekly.
      - name: Set up Rust
        run: bash scripts/setup-rust.sh

      # Same version and checksum as security.yml — bump both together.
      - name: Install cargo-deny 0.20.2 (checksum-pinned)
        env:
          VERSION: 0.20.2
          SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
        run: |
          set -euo pipefail
          name="cargo-deny-${VERSION}-x86_64-unknown-linux-musl"
          archive="$RUNNER_TEMP/${name}.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${VERSION}/${name}.tar.gz"
          echo "${SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/cargo-deny-unpacked" "$RUNNER_TEMP/cargo-deny-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/cargo-deny-unpacked"
          binary=$(find "$RUNNER_TEMP/cargo-deny-unpacked" -type f -name cargo-deny | head -n 1)
          install -m 0755 "$binary" "$RUNNER_TEMP/cargo-deny-bin/cargo-deny"

      # `cargo metadata --locked` first: the advisories are checked against
      # exactly the committed Cargo.lock, never a freshly resolved graph.
      - name: Rust dependency advisories (cargo-deny, RustSec)
        run: |
          set -euo pipefail
          export PATH="$RUNNER_TEMP/cargo-deny-bin:$PATH"
          (cd src-tauri && cargo metadata --locked --format-version 1 > /dev/null)
          cargo deny --manifest-path src-tauri/Cargo.toml check advisories

      - name: Version strings in sync
        run: node scripts/sync-version.mjs --check

      # Fail in seconds, not in the platform builds: `tauri build` refuses
      # Rust and npm Tauri packages on different major.minor releases.
      - name: Tauri packages match (Rust ↔ npm)
        run: node scripts/tauri-versions.mjs

      # package.json is the version source for every trigger mode.
      - name: Resolve version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Installed copies accept only plain x.y.z versions — in latest.json
      # (update notifications) and in updater.json (src-tauri/src/updates.rs)
      # — so a pre-release would break every installed copy's update check.
      # Prepare release and CI's tag-release refuse one too.
      - name: Version is x.y.z
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json's version ${VERSION} isn't x.y.z — installed copies accept no other version (src-tauri/src/updates.rs). Release a plain x.y.z version."
            exit 1
          fi

      # Tag push and dispatch-on-tag alike: github.ref is the tag.
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ "v${VERSION}" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version v${VERSION}"
            exit 1
          fi

      # Audit F-26: v1.1.0 shipped with empty notes because its section was
      # still "Unreleased". No notes, no release.
      - name: Release notes exist in CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: node scripts/changelog.mjs check "$VERSION"

      # Only reviewed code may ship (audit F-03/F-04): the commit being
      # released must already be part of master's history. A tag on a side
      # commit — or on anything pushed around branch protection — is refused.
      # GITHUB_SHA is the tagged commit (tag push or dispatch on the tag) or
      # master's head (re-publish from master).
      - name: Released commit is on master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/master...${GITHUB_SHA}" --jq .status)
          if [ "$status" != "identical" ] && [ "$status" != "behind" ]; then
            echo "::error::${GITHUB_SHA} is not on master (compare status: ${status}) — release only merged commits."
            exit 1
          fi

  build:
    name: Build (${{ matrix.platform }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          # args: for both `tauri build` and `tauri bundle`. bundles: what to
          # package. Only the published installer is bundled: tauri.conf.json's
          # "targets" lists one per platform (plus macOS's .app, which the
          # DMG and the update archive are made from), and --bundles keeps it
          # that way should that list ever grow (an MSI, .deb or .rpm would
          # never be published).
          - platform: windows-latest
            args: ""
            bundles: "--bundles nsis"
            rust_targets: ""
            glob: "src-tauri/target/release/bundle/nsis/*-setup.exe"
            out: CoreTools-Windows-Setup.exe
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            bundles: ""
            rust_targets: "aarch64-apple-darwin x86_64-apple-darwin"
            glob: "src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg"
            out: CoreTools-macOS.dmg
          # --verbose makes Tauri print linuxdeploy's own output, which is
          # otherwise reduced to "failed to run linuxdeploy".
          - platform: ubuntu-22.04
            args: "--verbose"
            bundles: "--bundles appimage"
            rust_targets: ""
            glob: "src-tauri/target/release/bundle/appimage/*.AppImage"
            out: CoreTools-Linux.AppImage

    runs-on: ${{ matrix.platform }}

    env:
      # This platform's installer gets code-signed (decided by the quality job).
      # Never name this SIGN: linuxdeploy's AppImage plugin reads $SIGN as
      # "GPG-sign the AppImage" when it is set at all — even to "false" — and
      # then aborts for want of a key (the v1.2.0 Linux release failure).
      CODE_SIGN: ${{ (matrix.platform == 'windows-latest' && needs.quality.outputs.sign-windows == 'true') || (matrix.platform == 'macos-latest' && needs.quality.outputs.sign-macos == 'true') }}
      # In-app updates are on (decided by the quality job): compile in the
      # public key; on macOS also produce the .app.tar.gz the updater installs.
      UPDATER: ${{ needs.quality.outputs.updater }}
      TAURI_ARGS: ${{ matrix.args }}
      TAURI_BUNDLES: ${{ matrix.bundles }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # The version pinned in rust-toolchain.toml, with the runner's rustup.
      - name: Set up Rust
        shell: bash
        env:
          RUST_TARGETS: ${{ matrix.rust_targets }}
        run: bash scripts/setup-rust.sh $RUST_TARGETS

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libdbus-1-dev \
            pkg-config \
            libfuse2 \
            file \
            xdg-utils

      - name: Install frontend dependencies
        run: npm ci

      # Reproducible builds (audit F-05 / S-3): the release builds exactly the
      # committed dependency set or fails.
      - name: Cargo.lock is committed and current
        working-directory: src-tauri
        shell: bash
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "::error::src-tauri/Cargo.lock is not committed (audit S-3)."
            exit 1
          fi
          cargo metadata --locked --format-version 1 > /dev/null

      - name: Generate app icons
        run: npm run icon

      # In-app updates: the public key is compiled in from a config file
      # passed with --config, so tauri.conf.json — and local builds — carry
      # no updater key. Nothing here needs the private key.
      - name: Updater configuration
        if: env.UPDATER == 'true'
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const path = require("path");
            const pubkey = process.argv[1].trim();
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP, "tauri.updater.json"), JSON.stringify({ plugins: { updater: { pubkey } } }));
          ' "$PUBKEY"

      # The Google OAuth "Desktop app" client for Authenticator cloud backup
      # is compiled in (see DEPLOYMENT.md §Cloud backup). When these secrets
      # are absent the build still succeeds and the feature reports itself
      # as not configured. On a code-signed platform this step only compiles
      # (--no-bundle); bundling + signing follow in their own step, the only
      # one that holds signing credentials. Everything after `--` goes to
      # `cargo build`: --locked builds exactly the committed Cargo.lock (the
      # check above already refused a stale one; this keeps cargo from ever
      # resolving anew mid-build).
      - name: Build the desktop app
        shell: bash
        env:
          CORETOOLS_GOOGLE_CLIENT_ID: ${{ secrets.CORETOOLS_GOOGLE_CLIENT_ID }}
          CORETOOLS_GOOGLE_CLIENT_SECRET: ${{ secrets.CORETOOLS_GOOGLE_CLIENT_SECRET }}
          # AppImage bundling (Linux only; ignored elsewhere): linuxdeploy and
          # its plugins are themselves AppImages — extract and run them rather
          # than mounting through FUSE, so a runner-image change can't break it.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -eo pipefail
          cfg() { if command -v cygpath >/dev/null 2>&1; then cygpath -w "$1"; else printf '%s' "$1"; fi; }
          args=()
          if [ -n "$TAURI_ARGS" ]; then read -r -a args <<< "$TAURI_ARGS"; fi
          if [ "$UPDATER" = "true" ]; then args+=(--config "$(cfg "$RUNNER_TEMP/tauri.updater.json")"); fi
          if [ "$CODE_SIGN" = "true" ]; then
            # Bundling waits for its own step, which holds the signing credentials.
            args+=(--no-bundle)
          elif [ -n "$TAURI_BUNDLES" ]; then
            read -r -a bundles <<< "$TAURI_BUNDLES"
            args+=("${bundles[@]}")
          fi
          npm run tauri build -- "${args[@]}" -- --locked

      # Windows signing: Azure Artifact Signing (formerly Trusted Signing) via
      # artifact-signing-cli, which runs signtool with Microsoft's signing
      # dlib after `az login` as the service principal. Tauri calls it for the
      # app binary and the installer (bundle.windows.signCommand, object form
      # so no argument is split on spaces).
      - name: Prepare code signing (Windows)
        if: matrix.platform == 'windows-latest' && env.CODE_SIGN == 'true'
        shell: bash
        env:
          ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$ENDPOINT" | grep -Eq '^https://[a-z0-9-]+\.codesigning\.azure\.net/?$'; then
            echo "::error::AZURE_ARTIFACT_SIGNING_ENDPOINT must be the account's regional endpoint, e.g. https://eus.codesigning.azure.net (got \"$ENDPOINT\")."
            exit 1
          fi
          # Pinned version, built from crates.io with its locked dependencies.
          cargo install artifact-signing-cli --version 0.11.0 --locked
          # The tool defaults to SDK 10.0.26100.0's signtool and the standard
          # Azure CLI path; point it at what this runner actually has.
          signtool=$(ls -d "/c/Program Files (x86)/Windows Kits/10/bin/"10.*/x64/signtool.exe 2>/dev/null | sort -V | tail -n 1 || true)
          azcli=$(where.exe az.cmd 2>/dev/null | head -n 1 | tr -d '\r' || true)
          if [ -z "$signtool" ] || [ -z "$azcli" ]; then
            echo "::error::signtool.exe (Windows SDK) or the Azure CLI is missing on this runner."
            exit 1
          fi
          echo "SIGNTOOL_PATH=$(cygpath -w "$signtool")" >> "$GITHUB_ENV"
          echo "AZURE_CLI_PATH=${azcli}" >> "$GITHUB_ENV"
          node -e '
            const [endpoint, account, profile] = process.argv.slice(1);
            const config = { bundle: { windows: { signCommand: {
              cmd: "artifact-signing-cli",
              args: ["-e", endpoint, "-a", account, "-c", profile, "-d", "CoreTools", "%1"],
            } } } };
            require("fs").writeFileSync(
              require("path").join(process.env.RUNNER_TEMP, "tauri.windows-signing.json"),
              JSON.stringify(config, null, 2),
            );
          ' "$ENDPOINT" "$ACCOUNT" "$PROFILE"

      - name: Bundle and sign (Windows)
        if: matrix.platform == 'windows-latest' && env.CODE_SIGN == 'true'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: |
          set -eo pipefail
          args=(--config "$(cygpath -w "$RUNNER_TEMP/tauri.windows-signing.json")")
          if [ -n "$TAURI_ARGS" ]; then read -r -a more <<< "$TAURI_ARGS"; args+=("${more[@]}"); fi
          if [ -n "$TAURI_BUNDLES" ]; then read -r -a more <<< "$TAURI_BUNDLES"; args+=("${more[@]}"); fi
          if [ "$UPDATER" = "true" ]; then args+=(--config "$(cygpath -w "$RUNNER_TEMP/tauri.updater.json")"); fi
          npm run tauri bundle -- "${args[@]}"

      # macOS signing: Tauri imports APPLE_CERTIFICATE (base64 .p12) into a
      # temporary keychain, signs with the Developer ID identity, notarizes
      # with APPLE_ID / APPLE_PASSWORD (app-specific) / APPLE_TEAM_ID and
      # staples the ticket. APPLE_SIGNING_IDENTITY is optional (default: the
      # certificate's identity) — exported only when set, because Tauri
      # treats an empty variable as set.
      - name: Bundle, sign and notarize (macOS)
        if: matrix.platform == 'macos-latest' && env.CODE_SIGN == 'true'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -eo pipefail
          if [ -n "$SIGNING_IDENTITY" ]; then export APPLE_SIGNING_IDENTITY="$SIGNING_IDENTITY"; fi
          unset SIGNING_IDENTITY
          read -r -a args <<< "$TAURI_ARGS"
          if [ "$UPDATER" = "true" ]; then args+=(--config "$RUNNER_TEMP/tauri.updater.json"); fi
          npm run tauri bundle -- "${args[@]}"

      - name: Collect the installer under its stable asset name
        shell: bash
        env:
          GLOB: ${{ matrix.glob }}
          OUT: ${{ matrix.out }}
        run: |
          set -eo pipefail
          mkdir -p staging
          # GLOB comes from the matrix above; left unquoted so it expands.
          src=$(ls $GLOB | head -n 1)
          echo "Found installer: $src"
          cp "$src" "staging/$OUT"

      # A signed platform must really be signed before anything is uploaded.
      - name: Verify the Authenticode signature (Windows)
        if: matrix.platform == 'windows-latest' && env.CODE_SIGN == 'true'
        shell: pwsh
        env:
          OUT: ${{ matrix.out }}
        run: |
          $sig = Get-AuthenticodeSignature -FilePath "staging/$env:OUT"
          Write-Host "Status: $($sig.Status) — signer: $($sig.SignerCertificate.Subject) — timestamped: $($null -ne $sig.TimeStamperCertificate)"
          if ($sig.Status -ne 'Valid') {
            Write-Host "::error::staging/$env:OUT is not validly signed ($($sig.Status): $($sig.StatusMessage))."
            exit 1
          }

      # Microsoft Store package (MSIX), once Partner Center's identity is set
      # (the quality job checked it). Tauri makes no MSIX: scripts/msix.mjs
      # packs the app binary built above with the runner's Windows SDK. The
      # Store signs the package during certification and updates Store
      # installs, so the app turns its own updater off inside a package
      # (src-tauri/src/updates.rs). It is uploaded in Partner Center by hand
      # and never published here: its artifact name doesn't match the publish
      # job's CoreTools-* download.
      - name: Microsoft Store package (MSIX)
        if: matrix.platform == 'windows-latest' && vars.MSIX_IDENTITY_NAME != ''
        shell: bash
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: node scripts/msix.mjs pack --exe src-tauri/target/release/coretools.exe --out-dir store

      - name: Upload the Microsoft Store package
        if: matrix.platform == 'windows-latest' && vars.MSIX_IDENTITY_NAME != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: microsoft-store-msix
          path: store/
          if-no-files-found: error
          retention-days: 30

      - name: Verify signature and notarization (macOS)
        if: matrix.platform == 'macos-latest' && env.CODE_SIGN == 'true'
        run: |
          set -euo pipefail
          app=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -n 1)
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"

      # In-app updates on macOS replace the .app from a .tar.gz of the bundle
      # (Windows installs the NSIS setup itself, as an update; Linux replaces
      # the AppImage — both are already staged). Tauri only makes this
      # archive with createUpdaterArtifacts, which needs the private key, so
      # it is made here and signed by the sign-updates job. Layout as Tauri's:
      # one top-level CoreTools.app/ directory (the updater strips the first
      # path component), symlinks kept, no AppleDouble (._*) files.
      - name: Update archive (macOS)
        if: matrix.platform == 'macos-latest' && env.UPDATER == 'true'
        run: |
          set -euo pipefail
          app=$(ls -d src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app | head -n 1)
          name=$(basename "$app")
          archive=staging/CoreTools-macOS.app.tar.gz
          COPYFILE_DISABLE=1 tar -C "$(dirname "$app")" -czf "$archive" "$name"
          if tar -tzf "$archive" | awk -v top="$name" 'index($0, top) != 1 || /(^|\/)\._/ { bad = 1 } END { exit !bad }'; then
            echo "::error::$archive has entries outside $name/ or AppleDouble files."
            exit 1
          fi
          if [ "$CODE_SIGN" = "true" ]; then
            check=$(mktemp -d)
            tar -xzf "$archive" -C "$check"
            codesign --verify --deep --strict "$check/$name"
            echo "The archived app's signature survives extraction."
          fi
          ls -l "$archive"

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.out }}
          # The installer, plus (macOS, with in-app updates) the update archive.
          path: staging/
          if-no-files-found: error
          retention-days: 30

  sbom:
    # Audit F-30: a CycloneDX SBOM of everything the release is built from —
    # npm (package-lock.json, via npm's own `npm sbom`) and Rust
    # (src-tauri/Cargo.lock for every target platform, via the CycloneDX
    # project's cargo-cyclonedx) — merged into one document by
    # scripts/sbom-merge.mjs and published as CoreTools-sbom.cdx.json.
    name: SBOM (CycloneDX — npm + Rust)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Set up Rust
        run: bash scripts/setup-rust.sh

      # Pinned version, built from crates.io with its locked dependencies.
      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      # The committed lockfile is the exact Rust dependency set (the quality
      # job already refused a release without one).
      - name: Rust dependency set
        id: lock
        working-directory: src-tauri
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 > /dev/null
          echo "source=committed" >> "$GITHUB_OUTPUT"

      - name: Rust SBOM (all target platforms)
        working-directory: src-tauri
        run: cargo cyclonedx --format json --spec-version 1.5 --target all --override-filename rust-sbom

      - name: npm SBOM (package-lock.json)
        run: npm sbom --sbom-format cyclonedx --sbom-type application --package-lock-only > "$RUNNER_TEMP/npm-sbom.json"

      - name: Merge into the release SBOM
        env:
          VERSION: ${{ needs.quality.outputs.version }}
          CARGO_LOCK: ${{ steps.lock.outputs.source }}
        run: |
          set -euo pipefail
          mkdir -p staging
          node scripts/sbom-merge.mjs --name CoreTools --version "$VERSION" \
            --npm "$RUNNER_TEMP/npm-sbom.json" --cargo src-tauri/rust-sbom.json \
            --cargo-lock "$CARGO_LOCK" --out staging/CoreTools-sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CoreTools-sbom.cdx.json
          path: staging/CoreTools-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

  sign-updates:
    # Audit S-2 / H1: the ONLY job that holds the updater's private key — the
    # key that makes every installed copy install a file. It builds nothing
    # and runs no install scripts: `npm ci --ignore-scripts` unpacks the
    # lockfile-pinned, integrity-checked packages, and the only package code
    # that runs is the Tauri CLI's own `tauri signer sign`. It signs
    # version-named copies, so each signature's trusted comment says
    # `file:CoreTools_<version>_<target>.<ext>` — installed copies refuse a
    # signed name without `_<version>_`, so an old file can't be replayed as
    # an update — and checks every signature against the public key the
    # builds compiled in. Only the .sig files leave this job.
    name: Sign in-app updates
    needs: [quality, build]
    if: needs.quality.outputs.updater == 'true'
    runs-on: ubuntu-latest
    # The signing secrets can live here (DEPLOYMENT.md, "Manual steps"); with
    # required reviewers this job — like publish — waits for an approval.
    environment:
      name: release
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.quality.outputs.version }}
    steps:
      - name: Checkout (package-lock.json + scripts)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install the Tauri CLI (lockfile-exact, no install scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Download the Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: CoreTools-Windows-Setup.exe
          path: incoming

      - name: Download the macOS update archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: CoreTools-macOS.dmg
          path: incoming

      - name: Download the Linux AppImage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: CoreTools-Linux.AppImage
          path: incoming

      - name: The private key is configured
        env:
          HAS_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "::error::TAURI_UPDATER_PUBKEY is set but the TAURI_SIGNING_PRIVATE_KEY secret is missing (repository or \`release\` environment). Add it, or delete the variable to release without in-app updates (DEPLOYMENT.md, In-app updates)."
            exit 1
          fi

      - name: Stage version-named copies
        run: |
          set -euo pipefail
          mkdir -p sign
          cp incoming/CoreTools-Windows-Setup.exe "sign/CoreTools_${VERSION}_windows-x86_64-setup.exe"
          cp incoming/CoreTools-macOS.app.tar.gz "sign/CoreTools_${VERSION}_darwin-universal.app.tar.gz"
          cp incoming/CoreTools-Linux.AppImage "sign/CoreTools_${VERSION}_linux-x86_64.AppImage"
          ls -l sign

      # Residual risk (accepted for now): the signer is the @tauri-apps/cli
      # npm package — lockfile-pinned, integrity-checked, no install scripts,
      # but still third-party code holding the private key. A dependency-free
      # Node-crypto signer beside scripts/verify-update-signature.mjs would
      # remove it.
      - name: Sign the update files
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for file in sign/CoreTools_*; do
            case "$file" in *.sig) continue ;; esac
            node_modules/.bin/tauri signer sign "$file" < /dev/null
          done

      # The key pair must match: a private key that isn't the compiled-in
      # public key's partner would publish updates no installed copy accepts.
      - name: Verify the signatures against the compiled-in public key
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          node scripts/verify-update-signature.mjs --pubkey "$PUBKEY" --version "$VERSION" \
            "sign/CoreTools_${VERSION}_windows-x86_64-setup.exe" \
            "sign/CoreTools_${VERSION}_darwin-universal.app.tar.gz" \
            "sign/CoreTools_${VERSION}_linux-x86_64.AppImage"

      # Published under the stable asset names (the signature covers the
      # bytes; only its trusted comment carries the versioned name).
      - name: Signatures under the published file names
        run: |
          set -euo pipefail
          mkdir -p signatures
          cp "sign/CoreTools_${VERSION}_windows-x86_64-setup.exe.sig" signatures/CoreTools-Windows-Setup.exe.sig
          cp "sign/CoreTools_${VERSION}_darwin-universal.app.tar.gz.sig" signatures/CoreTools-macOS.app.tar.gz.sig
          cp "sign/CoreTools_${VERSION}_linux-x86_64.AppImage.sig" signatures/CoreTools-Linux.AppImage.sig

      - name: Upload the signatures
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CoreTools-updater-signatures
          path: signatures/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish to jaychandra1/artifacts
    # A release is all-or-nothing: if any platform, the SBOM or (with in-app
    # updates) the signing failed, nothing ships and nothing is overwritten.
    # No mixed-version download sets, ever. sign-updates is skipped exactly
    # when in-app updates are off; any other outcome stops the release.
    needs: [quality, build, sbom, sign-updates]
    if: >-
      needs.quality.result == 'success' && needs.build.result == 'success' && needs.sbom.result == 'success'
      && (needs.sign-updates.result == 'success' || (needs.sign-updates.result == 'skipped' && needs.quality.outputs.updater != 'true'))
      && !cancelled()
    runs-on: ubuntu-latest
    # Publishing pauses here for a required reviewer once the `release`
    # environment has protection rules (DEPLOYMENT.md §2 · audit F-03): no
    # one — not a stolen session, not a bad merge — publishes installers
    # without an explicit approval. (ARTIFACTS_REPO_TOKEN stays a repository
    # secret so the quality job can fail fast on an expired token.)
    environment:
      name: release
      url: https://github.com/jaychandra1/artifacts/tree/main/coretools/releases
    # Publishing goes to ANOTHER (public) repository with its own token, so
    # this repo's GITHUB_TOKEN stays read-only. id-token lets Sigstore issue
    # a short-lived signing certificate bound to this workflow run.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout (publish script + changelog)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # CoreTools-* only: the Microsoft Store package (microsoft-store-msix)
      # goes to Partner Center, never to the public release.
      - name: Download the installers, the SBOM and the update signatures
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: CoreTools-*
          path: incoming
          merge-multiple: true

      - name: Require all three installers and the SBOM
        run: |
          set -e
          ls -lh incoming
          for f in CoreTools-Windows-Setup.exe CoreTools-macOS.dmg CoreTools-Linux.AppImage CoreTools-sbom.cdx.json; do
            test -f "incoming/$f" || { echo "::error::Missing $f — refusing to publish a partial release"; exit 1; }
          done

      # In-app updates: the manifest installed copies poll (published with the
      # release, so the stable coretools-latest link always serves the newest).
      # Its signatures are verified against the key compiled into the app, so
      # it needs no other protection; the script also refuses a signature
      # whose signed name lacks _<version>_. Nothing is written without the
      # updater key.
      - name: Updater manifest
        env:
          VERSION: ${{ needs.quality.outputs.version }}
          UPDATER: ${{ needs.quality.outputs.updater }}
        run: |
          set -euo pipefail
          node scripts/changelog.mjs notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          extra=()
          if [ "$UPDATER" = "true" ]; then extra=(--require); fi
          node scripts/updater-manifest.mjs --dir incoming --version "$VERSION" \
            --base-url "https://github.com/jaychandra1/artifacts/releases/download/coretools-v${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md" "${extra[@]}"

      # EVERY file in incoming/ is published, so every one is listed — the
      # installers, the SBOM and, with in-app updates, the macOS update
      # archive, the *.sig files and updater.json — and the signature below
      # covers them all. promote-latest.yml re-publishes only files listed
      # here, and the publish action refuses any file that isn't. (The
      # Sigstore bundle, made from this file next, is the one exception.)
      - name: Generate SHA-256 checksums
        working-directory: incoming
        run: |
          set -euo pipefail
          if find . -mindepth 1 ! -type f | grep -q .; then
            echo "::error::incoming/ holds something other than files:"
            find . -mindepth 1 ! -type f
            exit 1
          fi
          # Every file, in byte order, except the checksum file itself and its
          # Sigstore bundle. A glob, not `ls | grep` (shellcheck SC2010).
          export LC_ALL=C
          shopt -s nullglob
          files=()
          for f in *; do
            case "$f" in
              SHA256SUMS.txt | SHA256SUMS.txt.sigstore.json) ;;
              *) files+=("$f") ;;
            esac
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::incoming/ holds no files to checksum."
            exit 1
          fi
          sha256sum -- "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Keyless Sigstore signature over the checksum file (which pins every
      # published file). The certificate names this repository +
      # workflow + ref, so someone holding only ARTIFACTS_REPO_TOKEN can
      # replace the files but cannot produce a signature that verifies (audit
      # F-03). The signature is recorded in Sigstore's public transparency log.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the checksums
        working-directory: incoming
        run: cosign sign-blob --yes --bundle SHA256SUMS.txt.sigstore.json SHA256SUMS.txt

      # package.json is the version source; the quality job already refused
      # any tag that doesn't match it.
      - name: Resolve version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish installers + update coretools/releases
        uses: ./.github/actions/publish-artifacts
        with:
          app: coretools
          app-name: CoreTools
          version: ${{ steps.version.outputs.value }}
          artifacts-repo: jaychandra1/artifacts
          token: ${{ secrets.ARTIFACTS_REPO_TOKEN }}
          assets-dir: incoming
          # Lets the notes print the exact `cosign verify-blob` command.
          signer: https://github.com/${{ github.repository }}/.github/workflows/release.yml
          # Which installers the build signed (empty = all unsigned).
          code-signed: ${{ needs.quality.outputs.code-signed }}
          # Staged rollout / update-check back-off. Runs started without
          # inputs (tag push, CI's tag-release) take the RELEASE_ROLLOUT
          # repository variable, if set — so the usual release-PR flow can
          # be staged too.
          rollout: ${{ inputs.rollout || vars.RELEASE_ROLLOUT }}
          check-after-hours: ${{ inputs.check-after-hours }}
          # A published coretools-v<version> is replaced only on request.
          allow-overwrite: ${{ inputs.overwrite-versioned-release && 'true' || 'false' }}
