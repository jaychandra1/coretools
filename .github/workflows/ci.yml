name: CI

# Quality gates on every push and pull request. Beyond the checks, this
# workflow only ever (1) moves the `production` branch pointer (promote-web),
# which the Vercel site deploys from — so the website ships only commits that
# passed these gates — and (2) tags a new version on master (tag-release),
# which hands over to release.yml. Both run only for master, after the gates.
#
# workflow_dispatch: the Prepare release workflow starts CI on its release
# branch this way (pull requests opened with GITHUB_TOKEN trigger no
# workflows); running it on master by hand re-runs the gates and then the
# master-only jobs (e.g. after a Dependabot auto-merge, whose merge commit —
# made through GITHUB_TOKEN — starts no push run either).

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Pull requests: a new push supersedes the running check. master: a running
# CI is never cancelled, so a started tag-release or promote-web finishes,
# and runs never overlap, so `production` never moves backwards. This does
# NOT mean every master push gets its own run: GitHub keeps one pending run
# per group and a newer push cancels the pending one, so only the running
# and the newest commit are checked. Consequence for releases: if another
# pull request is merged while a merged release PR's run is still queued,
# the release commit's run is cancelled and tag-release tags the NEWER
# commit (which carries the same version) — the release then includes that
# change too. Merge nothing else until the release is tagged.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Type-check, unit tests, dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # A test-only fake Google Drive once reached the public web app
      # (audit F-04). Temporary verification code is marked; refuse it.
      - name: No temporary test code
        run: |
          if grep -rnE "TEMP-VERIFY|__TEMP_DELETE_ME|mock-cloud" src; then
            echo "::error::Temporary test code found in src/ — remove it before merging (audit F-04)."
            exit 1
          fi

      - name: Install dependencies (lockfile-exact)
        run: npm ci

      - name: Type-check (svelte-check)
        run: npm run check

      - name: Unit tests (vitest)
        run: npm test

      - name: Production dependency audit (must be clean)
        run: npm audit --omit=dev --audit-level=low

      # Dev-only tools (test runner, bundler, type checker) don't ship, so an
      # advisory there doesn't block merges or releases — but it is reported
      # on every run, so it gets fixed in a normal pull request.
      - name: Dev dependency audit (reported, not blocking)
        run: |
          if ! npm audit --audit-level=low; then
            echo "::warning::npm audit reports advisories in dev-only dependencies (they don't ship). Update them in a normal pull request."
          fi

      - name: Version strings in sync
        run: node scripts/sync-version.mjs --check

      # `tauri build` refuses Rust and npm Tauri packages on different
      # major.minor releases — and only the release builds, so check here.
      - name: Tauri packages match (Rust ↔ npm)
        run: node scripts/tauri-versions.mjs

      # The Windows installer template must be exactly Tauri's template for
      # the pinned CLI plus our patches (they keep updates from deleting the
      # vault). A CLI bump fails here until it is regenerated.
      - name: Installer template is upstream + CoreTools patches
        run: node scripts/installer-template.mjs

  e2e:
    # The production web build in a real browser (audit F-17): Argon2id in
    # WebAssembly, IndexedDB, lock/unlock, sealed metadata, the audit chain.
    name: End-to-end smoke tests (browser)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies (lockfile-exact)
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: Run the smoke tests
        run: npm run test:e2e

  rust:
    name: Rust lint (clippy), tests and format
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The version pinned in rust-toolchain.toml (with rustfmt and clippy),
      # installed with the runner's rustup.
      - name: Set up Rust
        run: bash scripts/setup-rust.sh

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libdbus-1-dev \
            pkg-config

      # Reproducible builds (audit F-05 / S-3): once Cargo.lock is committed,
      # any change that would need it updated fails here instead of drifting.
      # Until then CI only warns, so development isn't blocked — but the
      # Release workflow refuses to run without the lockfile.
      - name: Cargo.lock is committed and current
        working-directory: src-tauri
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "::warning::src-tauri/Cargo.lock is not committed — builds are not reproducible and RELEASES ARE BLOCKED until it is. Run Actions → 'Generate Cargo.lock' and merge its pull request (audit S-3)."
          else
            cargo metadata --locked --format-version 1 > /dev/null
          fi

      # tauri::generate_context! requires the frontendDist directory to exist
      # at compile time; a stub is enough for lint builds.
      - name: Stub frontend dist
        run: mkdir -p dist && touch dist/index.html

      # Run `cargo fmt` in src-tauri before pushing.
      - name: Format check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy (deny warnings)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --all-targets

  rust-windows:
    # The Linux job above never compiles `cfg(windows)` code — Windows Hello
    # (hello.rs) and the WebView2 camera permission (webview_permissions.rs).
    # Without this job, a mistake there only surfaces in a release build.
    #
    # Windows minutes bill at 2× (audit F-29), so the compile check runs only
    # when Rust-related files changed. The job itself always runs and passes
    # when there is nothing to check, so it can stay a required status check
    # (a workflow-level `paths` filter would leave it pending forever).
    name: Rust build check (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Compare with the PR base, or with the commit before the push. When
      # that can't be determined (manual run, new branch, force-push), run.
      - name: Rust-related changes?
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          run_check() {
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "Windows Rust check runs: $1" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          }
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) run_check "'$EVENT' run — nothing to compare with" ;;
          esac
          if [ -z "$base" ] || [ -z "${base//0/}" ]; then run_check "no base commit to compare with"; fi
          if ! git fetch --no-tags --depth=1 origin "$base"; then run_check "base ${base} is not fetchable"; fi
          if ! files=$(git diff --name-only "$base" HEAD); then run_check "could not diff against ${base}"; fi
          if printf '%s\n' "$files" | grep -Eq '^(src-tauri/|Cargo\.(toml|lock)$|rust-toolchain(\.toml)?$|\.cargo/|scripts/setup-rust\.sh$|\.github/workflows/ci\.yml$)'; then
            run_check "Rust-related files changed since ${base:0:12}"
          fi
          echo "rust=false" >> "$GITHUB_OUTPUT"
          echo "No Rust-related changes since ${base:0:12} — Windows compile check skipped (job passes)." | tee -a "$GITHUB_STEP_SUMMARY"

      # The installer decides whether an update keeps the user's vault, so
      # any change to it (template, hooks, generator, Tauri CLI version) is
      # built for real below. Runs when that can't be determined, too.
      - name: Installer-related changes?
        id: installer
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          build() { echo "installer=true" >> "$GITHUB_OUTPUT"; echo "Installer build runs: $1" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; }
          case "$EVENT" in
            pull_request) base="$PR_BASE" ;;
            push) base="$PUSH_BEFORE" ;;
            *) build "'$EVENT' run" ;;
          esac
          if [ -z "$base" ] || [ -z "${base//0/}" ] || ! git fetch --no-tags --depth=1 origin "$base"; then build "no base commit to compare with"; fi
          if git diff --name-only "$base" HEAD | grep -Eq '^(src-tauri/installer/|scripts/installer-template\.mjs$)'; then build "installer files changed"; fi
          if git diff "$base" HEAD -- package-lock.json | grep -q '@tauri-apps/cli'; then build "Tauri CLI version changed"; fi
          echo "installer=false" >> "$GITHUB_OUTPUT"

      - name: Set up Rust
        if: steps.changes.outputs.rust == 'true' || steps.installer.outputs.installer == 'true'
        shell: bash
        run: bash scripts/setup-rust.sh

      - name: Cache Rust build
        if: steps.changes.outputs.rust == 'true' || steps.installer.outputs.installer == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"

      - name: Cargo.lock is committed and current
        if: steps.changes.outputs.rust == 'true'
        working-directory: src-tauri
        shell: bash
        run: |
          if [ -f Cargo.lock ]; then cargo metadata --locked --format-version 1 > /dev/null; fi

      - name: Stub frontend dist
        if: steps.changes.outputs.rust == 'true'
        shell: bash
        run: mkdir -p dist && touch dist/index.html

      # The gate: Windows-only code must compile (incl. that webview2-com
      # matches the version tauri uses).
      - name: Compile check (Windows targets)
        if: steps.changes.outputs.rust == 'true'
        working-directory: src-tauri
        run: cargo check --all-targets

      # Windows-only code (hello.rs, webview_permissions.rs, the secure
      # clipboard) is linted only here; same bar as the Linux job.
      - name: Clippy (deny warnings)
        if: steps.changes.outputs.rust == 'true'
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # installer/hooks.nsh forgets the Google sign-in only when "Delete the
      # application data" is ticked — never when an update runs the old
      # uninstaller. Run all three cases against a throwaway credential with
      # the real name (this runner is discarded afterwards).
      - name: Uninstaller hook
        if: steps.changes.outputs.rust == 'true'
        working-directory: src-tauri/installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) { choco install nsis -y --no-progress | Out-Null }
          $target = 'google.io.coretools.authenticator.cloud'
          function Test-SignIn {
            [bool]((cmdkey "/list:$target") -match "Target:.*$([regex]::Escape($target))")
          }
          function Invoke-Hook([int]$update, [int]$deleteAppData, [switch]$Confirm) {
            $exe = Join-Path $env:RUNNER_TEMP "hook-$update-$deleteAppData-$([int][bool]$Confirm).exe"
            $flags = @("/DOUT=$exe", "/DUPDATE=$update", "/DDELETE_APP_DATA=$deleteAppData")
            if ($Confirm) { $flags += "/DWITH_CONFIRM" }
            & $makensis /V2 @flags hooks.test.nsi
            if ($LASTEXITCODE -ne 0) { throw "makensis failed ($LASTEXITCODE)" }
            Start-Process -FilePath $exe -Wait
          }
          cmdkey "/generic:$target" /user:google /pass:ci-placeholder | Out-Null
          if (-not (Test-SignIn)) { throw 'Could not create the test credential' }
          Invoke-Hook 1 1
          if (-not (Test-SignIn)) { throw 'An update removed the Google sign-in' }
          Invoke-Hook 0 0
          if (-not (Test-SignIn)) { throw 'A plain uninstall removed the Google sign-in' }
          # The confirmation's default (and silent) answer is No: the data stays.
          Invoke-Hook 0 1 -Confirm
          if (-not (Test-SignIn)) { throw 'Unconfirmed "Delete the application data" removed the Google sign-in' }
          Invoke-Hook 0 1
          if (Test-SignIn) { throw '"Delete the application data" left the Google sign-in behind' }
          Write-Host 'Uninstaller hook: sign-in kept on update, plain uninstall and unconfirmed deletion; removed with app data.'

      # Build the real NSIS installer (debug binary: the installer script is
      # what's under test) and check it was made from our patched template.
      - name: Set up Node (installer build)
        if: steps.installer.outputs.installer == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build the Windows installer
        if: steps.installer.outputs.installer == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run tauri build -- --debug --bundles nsis

      - name: The installer runs the previous version's uninstaller as an update
        if: steps.installer.outputs.installer == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $script = Get-ChildItem src-tauri/target -Recurse -Filter installer.nsi | Select-Object -First 1
          if (-not $script) { throw 'No generated installer.nsi under src-tauri/target' }
          if (-not (Select-String -Path $script.FullName -SimpleMatch 'StrCpy $R1 "$R1 /UPDATE /P"' -Quiet)) {
            throw "$($script.FullName) wasn't generated from src-tauri/installer/installer.nsi"
          }
          $setup = Get-ChildItem src-tauri/target -Recurse -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'No installer was built' }
          Write-Host "Built $($setup.Name) from the patched template."

  promote-web:
    # Vercel deploys the `production` branch, not `master` (vercel.json
    # disables master deployments). This job moves `production` to a master
    # commit only after the web checks pass, so an untested commit can never
    # reach the public site (audit F-04).
    name: Promote to production (website)
    needs: [web, e2e]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write # moves one branch pointer; nothing else
    steps:
      - name: Point `production` at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/production" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/heads/production" \
              -f sha="${GITHUB_SHA}" -F force=true >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref=refs/heads/production -f sha="${GITHUB_SHA}" >/dev/null
          fi
          echo "production → ${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"

  tag-release:
    # Release pull request flow (audit F-26). When a master commit carries a
    # package.json version that has no v<version> tag yet — i.e. a merged
    # "Prepare release" PR — tag it once every gate passed, then start
    # release.yml on that tag.
    #
    # A tag pushed with GITHUB_TOKEN starts no `push` workflows (GitHub's
    # loop guard), so release.yml is started with workflow_dispatch on the
    # tag ref instead — the documented exception. It then runs exactly as for
    # a pushed tag: the tagged commit's workflow file, github.ref =
    # refs/tags/v<version>, all of its gates, and the `release` environment
    # approval before anything is published. A tag pushed by hand (`npm
    # version` + `git push --follow-tags`) already exists by the time this
    # job runs, so it does nothing and the tag push alone starts the release.
    name: Tag a new version (starts the release)
    needs: [web, e2e, rust, rust-windows]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates one v* tag; nothing else
      actions: write # starts release.yml on that tag
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Is this version tagged yet?
        id: version
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "${tag} already exists — nothing to release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      # The same checks release.yml applies, before a tag that rulesets make
      # hard to move or delete exists: a release PR merged before
      # src-tauri/Cargo.lock would otherwise tag a version whose release
      # refuses to run. (The rust jobs this job needs already proved a
      # committed lockfile current.) Untagged here, the version is tagged by
      # the first green master run after the lockfile is merged.
      - name: Version strings, release notes and Cargo.lock are ready
        if: steps.version.outputs.new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          test -f src-tauri/Cargo.lock || {
            echo "::error::src-tauri/Cargo.lock is not committed, so ${TAG} is not tagged — its release would refuse to run (audit S-3). Run Actions → 'Generate Cargo.lock' and merge its pull request; CI on master then tags ${TAG}."
            exit 1
          }
          if ! printf '%s' "${TAG#v}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::${TAG} isn't vX.Y.Z — installed copies accept no other version (src-tauri/src/updates.rs), and the release would refuse it."
            exit 1
          fi
          node scripts/sync-version.mjs --check
          node scripts/changelog.mjs check "${TAG#v}"

      - name: Create and push the tag
        if: steps.version.outputs.new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "release: ${TAG}" "$GITHUB_SHA"
          if ! git push origin "refs/tags/${TAG}"; then
            echo "::error::Could not push ${TAG}. If a tag ruleset restricts creating v* tags, add GitHub Actions to its bypass list (DEPLOYMENT.md, Repository protection)."
            exit 1
          fi

      - name: Start the Release workflow on the tag
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          {
            echo "### ${TAG} tagged — release started"
            echo ""
            echo "Release workflow runs on \`${TAG}\` and waits for approval in the \`release\` environment:"
            echo "https://github.com/${GITHUB_REPOSITORY}/actions/workflows/release.yml"
            echo ""
            echo "If it did not start, run Actions → Release → Run workflow and pick the tag \`${TAG}\`."
          } >> "$GITHUB_STEP_SUMMARY"
