[package]
name = "coretools"
version = "0.1.0"
description = "Offline file diff & merge and Kubernetes YAML optimizer"
authors = ["JDG Initiates"]
edition = "2021"
rust-version = "1.70"

# The Tauri application binary and the library share a crate. The library is
# what `tauri build` links against; `main.rs` is a thin launcher.
[lib]
name = "coretools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Enabled by `tauri build` to serve assets from the embedded bundle.
custom-protocol = ["tauri/custom-protocol"]
